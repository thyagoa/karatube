  chkUpd() { checkUpdate(false); },
  doUpd() { applyUpdate(); },
  tvUnpair() { D.settings.tvScreen = null; D.settings.tvPaired = false; save('settings'); render(); },
  newSong() { startNew(); },
  newVersion(d) { ui.sheets = []; startVersion(d.id); },
  songMenu(d) { openSheet({ type: 'songMenu', id: d.id }); },
  verMenu(d) { openSheet({ type: 'verMenu', code: d.code }); },
  editSong(d) { ui.sheets = []; startEdit(d.id, 'song'); },
  editVer(d) { ui.sheets = []; startEdit(X.ver[d.code].song, 'version', d.code); },
  setLink(d) { const v = X.ver[d.code]; v.link = d.v; v.updated = now(); save('versions'); ui.sheets.pop(); toast('Link marcado como ' + (d.v === 'ok' ? 'funcionando' : 'quebrado')); render(); },
  copyLink(d) { const v = X.ver[d.code]; try { navigator.clipboard.writeText(v.url || watchUrl(v.vid)); toast('Link copiado'); } catch (e) { toast('Não consegui copiar.'); } ui.sheets.pop(); render(); },
  delSong(d) { openSheet({ type: 'confirm', kind: 'song', id: d.id }); },
  delVer(d) { openSheet({ type: 'confirm', kind: 'ver', code: d.code }); },
  delList(d) { openSheet({ type: 'confirm', kind: 'list', id: d.id }); },
  doDel() {
    const t = sh(); ui.sheets = [];
    if (t.kind === 'song') { const s = X.song[t.id]; undoable('Música apagada: ' + s.title, () => purgeSong(t.id)); if (ui.draft && ui.draft.songCode === t.id) ui.draft = null; ui.songSel = null; ui.tab = 'cat'; }
    else if (t.kind === 'ver') { const v = X.ver[t.code]; const only = (X.vers[v.song] || []).length === 1; undoable('Versão apagada: ' + t.code, () => { purgeVersion(t.code); if (only) D.songs = D.songs.filter(s => s.id !== v.song); }); ui.draft = null; ui.tab = 'cat'; if (only) ui.songSel = null; }
    else { const l = D.lists.find(x => x.id === t.id); undoable('Lista apagada: ' + l.name, () => { D.lists = D.lists.filter(x => x.id !== t.id); }); ui.listSel = null; }
    render();
  },
  /* backup */
  async share() {
    const r = await shareBackup();
    if (r === 'shared') toast('Backup compartilhado.'); else if (r === 'downloaded') toast('Backup salvo na pasta Downloads.'); render();
  },
  saveDevice() { saveBackupToDevice(); toast('Backup salvo na pasta Downloads.'); render(); },
  snooze() { D.settings.snoozeUntil = now() + 7 * DAY; save('settings'); render(); },
  import() { doImportFlow(false); },
  frImport() { doImportFlow(true); },
  frDev(d) { ui.fr.device = d.v; render(); },
  frGo() { createDev(ui.fr.device, ui.fr.name); D.settings.created = now(); save('settings'); render(); },
  impChoice(d) { const x = sh().plan.difs.find(y => y.id === d.id); if (x) { x.choice = d.v; render(); } },
  impApply() {
    const t = sh(); const r = applyImport(t.plan); ui.sheets = []; ui.songSel = null;
    toast(r.added || r.changed ? `Importado: ${r.added} novas, ${r.changed} atualizadas.` : 'Importado.'); render();
  },
  /* ajustes */
  theme(d) { D.settings.theme = d.v; save('settings'); render(); },
  devRemove(d) {
    const l = D.settings.devs || []; const x = l.find(y => y.id === d.id); if (!x) return;
    if (!confirm('Remover "' + x.name + '" do cadastro de aparelhos? A faixa dele fica livre para outro aparelho.')) return;
    D.settings.devs = l.filter(y => y.id !== d.id); D.settings.devDel = (D.settings.devDel || []).concat(d.id); save('settings'); render(); syncSoon(1500);
  },
  async persist() { try { persistent = await navigator.storage.persist(); } catch (e) { persistent = false; } toast(persistent ? 'Dados protegidos.' : 'O navegador não concedeu a proteção.'); render(); },
  /* listas */
  lisSeg(d) { ui.lisSeg = d.v; ui.listSel = null; render(); },
  openList(d) { ui.listSel = d.id; navPush(); resetScroll('listedit'); render(); },
  listBack() { ui.listSel = null; render(); },
  newList() { openSheet({ type: 'newList', name: '', from: 'empty' }); },
  nlFrom(d) { const t = sh(); t.from = d.v; const e = $('#nlname'); if (e) t.name = e.value; render(); },
  newListFor(d) { ui.sheets.pop(); openSheet({ type: 'newList', name: '', from: 'empty', add: d.id }); },
  doNewList() {
    const t = sh(); const e = $('#nlname'); const name = (e ? e.value : t.name).trim() || 'Nova lista';
    const l = { id: uid(), name, items: [], created: now(), updated: now() };
    if (t.from === 'queue') l.items = D.queue.map(e2 => e2.code);
    if (t.add) { const b = bestVersion(t.add); if (b) l.items.push(b.code); }
    D.lists.push(l); save('lists'); ui.sheets = []; ui.tab = 'lis'; ui.lisSeg = 'listas'; ui.listSel = l.id; toast('Lista criada: ' + name); render();
  },
  addToList(d) { ui.sheets.pop(); openSheet({ type: 'addToList', id: d.id }); },
  doAddToList(d) {
    const l = D.lists.find(x => x.id === d.id); const b = bestVersion(d.song);
    if (b && !l.items.includes(b.code)) { l.items.push(b.code); l.updated = now(); save('lists'); toast('Adicionada a “' + l.name + '”'); } else toast('Já está nessa lista.');
    ui.sheets = []; render();
  },
  lMove(d) { const l = D.lists.find(x => x.id === ui.listSel); const items = l.items.filter(c => X.ver[c]); const i = +d.i, j = i + (+d.dir); if (j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; l.items = items; l.updated = now(); save('lists'); render(); },
  lRm(d) { const l = D.lists.find(x => x.id === ui.listSel); const items = l.items.filter(c => X.ver[c]); items.splice(+d.i, 1); l.items = items; l.updated = now(); save('lists'); render(); },
  listPick() { openSheet({ type: 'listPick', id: ui.listSel, q: '', sel: {} }); },
  doListPick() {
    const t = sh(); const l = D.lists.find(x => x.id === t.id);
    Object.keys(t.sel).forEach(id => { const b = bestVersion(id); if (b && !l.items.includes(b.code)) l.items.push(b.code); });
    l.updated = now(); save('lists'); ui.sheets = []; render();
  },
  listAddNow() { useListNow(ui.listSel, 'add'); render(); },
  listReplace() { openSheet({ type: 'useList', id: ui.listSel, mode: 'replace', cur: false }); },
  useList(d) { openSheet({ type: 'useList', id: d.id, mode: 'add', cur: false }); },
  useMode(d) { sh().mode = d.v; render(); },
  doUse() { const t = sh(); useListNow(t.id, t.mode, t.cur); ui.sheets = []; render(); },
  /* cadastro */
  draftMode(d) { const x = ui.draft; x.mode = d.v; if (d.v === 'version' && !x.songCode) x.songCode = null; render(); },
  draftScope(d) { ui.draft.scope = d.v; render(); },
  pick(d) { const x = ui.draft; x[d.f] = x[d.f] === d.v ? '' : d.v; render(); },
  pickLink(d) { ui.draft.link = d.v; render(); },
  pickRate(d) { const n = +d.n; ui.draft.rating = ui.draft.rating === n ? 0 : n; render(); },
  addAlias() { const e = $('#f-aliasIn'); const v = e && e.value.trim(); if (!v) return; const x = ui.draft; if (!x.aliases.map(norm).includes(norm(v)) && norm(v) !== norm(x.singer)) x.aliases.push(v); render(); const n = $('#f-aliasIn'); if (n) n.focus(); },
  rmAlias(d) { ui.draft.aliases.splice(+d.i, 1); render(); },
  addTag() { const e = $('#f-tagIn'); const v = e && e.value.trim(); if (!v) return; const x = ui.draft; if (!x.tags.includes(v)) x.tags.push(v); render(); const n = $('#f-tagIn'); if (n) n.focus(); },
  rmTag(d) { ui.draft.tags.splice(+d.i, 1); render(); },
  sugFill(d) {
    const x = ui.draft;
    if (d.f === 'tag') { if (!x.tags.includes(d.v)) x.tags.push(d.v); render(); return; }
    x[d.f] = d.v; render();
  },
  covPick(d) { ui.draft.coverOf = d.id; render(); },
  pickSong(d) { ui.draft.songCode = d.id; render(); },
  clearSong() { ui.draft.songCode = null; ui.draft.songQ = ''; render(); },
  refreshYT() { const x = ui.draft; x.vid = parseVid(x.url); if (!x.vid) return toast('Cole um link do YouTube primeiro.'); loadYT(true); },
  clearUrl() { const x = ui.draft; x.url = ''; x.vid = ''; x.ytTitle = ''; x.channel = ''; x.ytState = 'idle'; x.dupIgnored = false; render(); },
  dupIgnore() { ui.draft.dupIgnored = true; render(); },
  openDup(d) { ui.draft = null; goSong(d.id); },
  async romaji() {
    const x = ui.draft; if (!x.title.trim()) return toast('Escreva o título original primeiro.');
    if (!hasJapanese(x.title)) return toast('Só gera a partir de japonês. Digite o título romanizado à mão.');
    x.busyRomaji = true; render();
    try { const r = await toRomaji(x.title, t => { x.romajiStage = t; render(); }); x.roman = r; }
    catch (e) { toast('Não consegui gerar o romaji: ' + (e.message || 'erro') + '. Precisa de internet na primeira vez; toque de novo para tentar.', { ms: 7000 }); }
    x.romajiStage = '';
    x.busyRomaji = false; render();
  },
  async romajiLyric() {
    const x = ui.draft; const src = String(x.lyric || '').split(/\r?\n/).filter(l => l.trim()).slice(0, 5);
    if (!src.length) return toast('Escreva a letra original primeiro.');
    if (!src.some(hasJapanese)) return toast('Não achei japonês na letra. Digite a romanizada à mão.');
    const antes = x.lyricRoman;
    x.busyRomaji = true; render();
    try {
      const out = [];
      for (const l of src) out.push(hasJapanese(l) ? await toRomaji(l, t => { x.romajiStage = t; render(); }) : l);
      x.lyricRoman = out.join('\n');
      if (antes && antes.trim() && antes !== x.lyricRoman) toast('Letra romanizada substituída.', { action: 'Desfazer', onAction: () => { x.lyricRoman = antes; render(); } });
    } catch (e) { toast('Não consegui gerar o romaji: ' + (e.message || 'erro') + '. Precisa de internet na primeira vez; toque de novo para tentar.', { ms: 7000 }); }
    x.romajiStage = ''; x.busyRomaji = false; render();
  },
  artRemove() { ui.draft.art = ''; render(); },
  saveDraft() { saveDraft(); },
  cancelDraft() { cancelDraft(); },
  /* buscar online */
  onlineOpen() {
    const x = ui.draft; const q = [x.title, x.singer].filter(Boolean).join(' ').trim() || x.ytTitle || '';
    openSheet({ type: 'online', q, sel: (D.settings.bases || []).slice(), res: {}, chk: {}, ran: [], step: 'bases' });
  },
  onSearch() {
    const t = sh(); const e = $('#onq'); if (e) t.q = e.value; if (!t.sel.length) return toast('Marque ao menos uma base.');
    if (!t.q.trim()) return toast('Escreva o que procurar.');
    D.settings.bases = t.sel.slice(); save('settings');
    t.ran = BASES.map(b => b.id).filter(id => t.sel.includes(id)); t.res = {}; t.chk = {}; t.step = 'results'; render();
    searchBases(t.ran, t.q.trim(), (id, r) => { t.res[id] = r; onlineRefresh(t); if (sh() === t) render(); });
  },
  onBack() { sh().step = 'bases'; render(); },
  onImport() {
    const t = sh(); const x = ui.draft; let n = 0;
    t.ran.forEach(id => { const r = t.res[id]; if (!r || r.status !== 'ok') return; r.fields.forEach((f, i) => {
      if (!t.chk[id + ':' + i]) return; n++;
      if (f.key === 'alias') { if (!x.singer) x.singer = f.value; else if (!x.aliases.map(norm).includes(norm(f.value)) && norm(f.value) !== norm(x.singer)) x.aliases.push(f.value); }
      else if (f.key === 'lyric') x.lyric = f.value; else if (f.key === 'art') setArt(f.value); else x[f.key] = f.value;
    }); });
    ui.sheets = []; toast(n + (n === 1 ? ' campo importado.' : ' campos importados.')); render();
  }
};

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const h = ACT[el.dataset.act]; if (!h) return;
  h(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.enter) { e.preventDefault(); ACT[t.dataset.enter](t.dataset, t, e); return; }
  if (e.key === 'Enter' && t.id === 'jumpIn') { e.preventDefault(); ACT.jumpGo(); return; }
  if (e.key === 'Enter' && t.id === 'nlname') { e.preventDefault(); ACT.doNewList(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') && t.dataset.act && /BUTTON|INPUT|TEXTAREA/.test(t.tagName) === false) { e.preventDefault(); t.click(); }
});
let urlTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.query = t.value; ui.limit = 150; updateList(); return; }
  if (t.id === 'jumpIn') { const s = sh(); s.v = t.value; const m = jumpMatch(t.value); $('#jumpres').innerHTML = jumpResHtml(m); const b = $('.sh-f .btn.primary'); if (b) b.disabled = !m; return; }
  if (t.id === 'onq') { sh().q = t.value; return; }
  if (t.id === 'nlname') { sh().name = t.value; return; }
  if (t.id === 'lpq') { const s = sh(); s.q = t.value; const l = D.lists.find(x => x.id === s.id); const q = norm(s.q); const have = new Set(l.items.map(c => (X.ver[c] || {}).song)); $('#lplist').innerHTML = lpRows(sortSongs(D.songs.filter(x => !q || (X.text[x.id] || '').includes(q)), 'code', 'asc').slice(0, 120), have, s); return; }
  if (t.id === 'f-tagIn') { updSug('tag'); return; }
  const f = t.dataset && t.dataset.f;
  if (f && ui.draft) {
    ui.draft[f] = t.value;
    if (f === 'url') { clearTimeout(urlTimer); urlTimer = setTimeout(onUrlInput, 350); }
    else if (f === 'origin' || f === 'key' || f === 'singer') updSug(f);
    else if (f === 'coverOf') { const c = $('#covres'); if (c) c.innerHTML = coverResults(); }
    else if (f === 'year') { const c = $('#decade'); if (c) c.textContent = decadeOf(t.value) ? 'Década: ' + decadeOf(t.value) + ' (automático)' : ''; }
    else if (f === 'lyric') { const c = $('#lyrcnt'); if (c) c.textContent = String(t.value).split(/\r?\n/).filter(x => x.trim()).length + '/5 linhas'; }
    else if (f === 'songQ') { const c = $('#songres'); if (c) c.innerHTML = songResults(ui.draft); }
  }
});
document.addEventListener('change', e => {
  const t = e.target; const c = t.dataset && t.dataset.change; if (!c) return;
  const s = sh();
  switch (c) {
    case 'listName': { const l = D.lists.find(x => x.id === ui.listSel); if (l) { l.name = t.value.trim() || l.name; l.updated = now(); save('lists'); render(); } break; }
    case 'artUrl': { const u = t.value.trim(); if (/^https?:\/\//i.test(u)) setArt(u); else if (u) toast('Cole um link que comece com http.'); break; }
    case 'artFile': { const f = t.files && t.files[0]; if (f) { const r = new FileReader(); r.onload = () => shrinkImage(r.result, 420).then(d => { ui.draft.art = d; render(); }).catch(() => toast('Não consegui ler esta imagem.')); r.readAsDataURL(f); } break; }
    case 'devName': { const dv = devInfo(); if (dv) { dv.name = t.value.trim() || dv.name; save('settings'); render(); syncSoon(3000); } break; }
    case 'devSlot': { const dv = devInfo(); const k = parseInt(t.value, 10); if (dv && k >= 0) { dv.slot = k; save('settings'); render(); syncSoon(1500); toast('Faixa trocada. Vale só para músicas novas.'); } break; }
    case 'frName': ui.fr.name = t.value; break;
    case 'tvProxy': D.settings.tvProxy = t.value.trim(); save('settings'); break;
    case 'onBase': { const i = s.sel.indexOf(t.dataset.id); if (t.checked && i < 0) s.sel.push(t.dataset.id); if (!t.checked && i >= 0) s.sel.splice(i, 1); render(); break; }
    case 'onChk': s.chk[t.dataset.k] = t.checked; render(); break;
    case 'impNew': { const n = s.plan.novas.find(x => x.id === t.dataset.id); if (n) n.checked = t.checked; render(); break; }
    case 'lpChk': if (t.checked) s.sel[t.dataset.id] = 1; else delete s.sel[t.dataset.id]; render(); break;
    case 'useCur': s.cur = t.checked; break;
  }
});
window.addEventListener('popstate', () => {
  if (navDepth > 0) navDepth--;
  if (ui.sheets.length) { ui.sheets.pop(); render(); }
  else if (!ui.wide && ui.tab === 'cat' && ui.songSel) { ui.songSel = null; render(); }
  else if (!ui.wide && ui.tab === 'lis' && ui.listSel) { ui.listSel = null; render(); }
});
window.addEventListener('resize', () => { if (setWide()) render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ---------- início ---------- */
(async function init() {
  await loadState();
  ui.sort = D.settings.sort || 'code'; ui.dir = D.settings.dir || 'asc';
  setWide(); render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { }); if (/^https?:$/.test(location.protocol) && navigator.onLine) setTimeout(() => checkUpdate(true), 3000);
  setTimeout(() => ghSyncNow(false), 3500);
})();

</script>
</body>
</html>
