<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KaraTube</title>
<meta name="theme-color" content="#12101A">
<meta name="description" content="Catálogo pessoal de karaokê com códigos, fila e abertura direta no YouTube.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F4F3F9;--surface:#FFFFFF;--surface2:#EBE9F4;--line:#D9D5E8;--text:#17141F;--muted:#5B5575;
  --accent:#D01F66;--onAccent:#FFFFFF;--ok:#0F8A55;--onOk:#FFFFFF;--star:#E3A008;--danger:#C42B2B;--onDanger:#FFFFFF;
  --t1:#C9BDF2;--t2:#F4B6CF;--t3:#A9DCE8;--t4:#F1D79A;--t5:#B7E0BF;--t6:#D3BDF0;
  --scrim:rgba(8,6,14,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12101A;--surface:#1C1928;--surface2:#272339;--line:#37324F;--text:#F3F1FA;--muted:#A9A4C4;
    --accent:#FF5C98;--onAccent:#1A0A12;--ok:#4ADE9A;--onOk:#06281A;--star:#FFC247;--danger:#FF6B6B;--onDanger:#1A0A0A;
    --t1:#3D2F72;--t2:#6B2A52;--t3:#1F5566;--t4:#5A4416;--t5:#2F5A3B;--t6:#4A2F6B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12101A;--surface:#1C1928;--surface2:#272339;--line:#37324F;--text:#F3F1FA;--muted:#A9A4C4;
  --accent:#FF5C98;--onAccent:#1A0A12;--ok:#4ADE9A;--onOk:#06281A;--star:#FFC247;--danger:#FF6B6B;--onDanger:#1A0A0A;
  --t1:#3D2F72;--t2:#6B2A52;--t3:#1F5566;--t4:#5A4416;--t5:#2F5A3B;--t6:#4A2F6B;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope','Noto Sans JP',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:15px;line-height:1.35}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--text)}
#app{height:100vh;height:100dvh}
.jp{font-family:'Noto Sans JP','Manrope',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{display:flex}.fx1{flex:1;min-width:0}.col{display:flex;flex-direction:column}.ac{align-items:center}.jc{justify-content:center}.wrap{flex-wrap:wrap}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.none{flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding-left:16px;padding-right:16px}

/* shell */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:760px;margin:0 auto;position:relative;overflow:hidden}
.shell.wide{flex-direction:row;max-width:none}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface2);color:var(--text);height:44px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 14px 'Manrope',sans-serif;flex:none;white-space:nowrap}
.btn.primary{border:0;background:var(--accent);color:var(--onAccent)}
.btn.outline{border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
.btn.danger{border:0;background:var(--danger);color:var(--onDanger)}
.btn.dangerOutline{border:1.5px solid var(--danger);background:transparent;color:var(--danger)}
.btn.text{border:0;background:none;color:var(--muted)}
.btn.ok{border:0;background:var(--ok);color:var(--onOk)}
.btn.grow{flex:1;min-width:0}
.btn.lg{height:52px;border-radius:14px;font-size:15px}
.btn.sm{padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{border:0;background:none;color:var(--text);width:44px;height:44px;flex:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib.bd{border:1px solid var(--line);background:var(--surface)}
.ib.round{border-radius:22px}
.ib.ok{background:var(--ok);color:var(--onOk);border:0}
.ib.acc{color:var(--accent)}
.ib.dng{color:var(--danger)}
.chip{height:44px;padding:0 16px;border-radius:22px;font:700 14px 'Manrope','Noto Sans JP',sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--text);flex:none;white-space:nowrap}
.chip.sel{border-color:var(--accent);background:var(--accent);color:var(--onAccent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.sug{height:44px;border:0;background:none;padding:0 3px}
.sug span{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font:700 12px 'Manrope','Noto Sans JP',sans-serif}
.sugrow{display:flex;flex-wrap:wrap;align-items:center;margin-top:2px;min-height:0}
.sugrow small{font-size:11px;font-weight:700;color:var(--muted);margin-right:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:0 4px 0 10px;border-radius:14px;background:var(--surface2);height:32px}
.tag button{border:0;background:none;width:28px;height:28px;padding:0;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}

/* campos */
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.lbl.first{margin-top:0}
.field{min-height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.field:focus-within,.area:focus-within{border-color:var(--accent)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 15px 'Manrope','Noto Sans JP',sans-serif;height:46px}
.field .ico{color:var(--muted);display:flex}
.area{border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:10px 14px}
.area textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;font:500 15px 'Manrope','Noto Sans JP',sans-serif;min-height:60px}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg.alt{background:var(--surface2)}
.seg button{flex:1;border:0;background:none;height:44px;border-radius:10px;font:700 13px 'Manrope',sans-serif;color:var(--text)}
.seg button.sel{background:var(--accent);color:var(--onAccent);font-weight:800}
.card{padding:14px;margin-bottom:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.card h3{margin:0;font-size:15px;font-weight:800}
.card p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
input[type=checkbox],input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.rate{display:flex;gap:8px}
.rate button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:800 15px 'JetBrains Mono',monospace}
.rate button.sel{border-color:var(--accent);background:var(--accent);color:var(--onAccent)}
.banner{margin:0 0 10px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--star)}
.banner b{font-size:13px;font-weight:700;line-height:1.4;display:block}
.warn{margin-top:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--star)}

/* cabeçalhos */
.hdr{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;flex:none}
.hdr h1{margin:0;flex:1;min-width:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;flex:none}
.topbar{display:flex;align-items:center;gap:4px;padding:8px 12px 0 8px;flex:none}
.topbar h2{margin:0;flex:1;min-width:0;font-size:18px;font-weight:800}
.searchbox{height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted)}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 15px 'Manrope','Noto Sans JP',sans-serif;height:46px}
.sub{display:flex;justify-content:space-between;align-items:center;padding:0 18px 4px;font-size:13px;color:var(--muted)}
.sub button{border:0;background:none;color:var(--muted);height:44px;font:700 13px 'Manrope',sans-serif;padding:0}

/* linhas de música */
.thumb{position:relative;overflow:hidden;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Noto Sans JP','Manrope',sans-serif;color:var(--text)}
.thumb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.srow{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;color:var(--text)}
.srow.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.srow .t{font-size:16px;font-weight:700;line-height:1.25}
.srow .r{font-size:13px;color:var(--muted)}
.codepill{flex:none;font:600 12px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:6px;background:var(--surface2)}
.stack{display:flex;flex-direction:column;flex:none}
.empty{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;gap:0}
.empty .big{width:112px;height:112px;border-radius:56px;background:var(--surface);border:1.5px dashed var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center}
.empty h3{font-size:20px;font-weight:800;margin:20px 0 0}
.empty p{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.5}

/* música */
.vcard{padding:12px;margin-bottom:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.vcard .pv{width:96px;height:54px;border-radius:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:5px;flex:none}
.dot.ok{background:var(--ok)}.dot.unverified{background:var(--muted)}.dot.broken{background:var(--danger)}
.mini{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--surface2)}
details.box{border:1.5px dashed var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
details.box summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:14px;list-style:none}
details.box summary::-webkit-details-marker{display:none}

/* barra mínima, nav, trilho */
.minibar{margin:0 8px 8px;min-height:64px;flex:none;border-radius:18px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px}
.minibar.mbe{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.minibar .tt{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;display:flex;align-items:center;gap:10px;height:64px;color:inherit}
.qcount{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;flex:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono',monospace}
.nav{flex:none;height:64px;display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:6px}
.nav button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 12px 'Manrope',sans-serif}
.nav button.on{color:var(--accent)}
.rail{width:88px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;background:var(--surface);border-right:1px solid var(--line)}
.rail button{width:72px;height:64px;border:0;background:none;color:var(--muted);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 12px 'Manrope',sans-serif}
.rail button.on{background:var(--surface2);color:var(--accent)}
.qpanel{width:360px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nowcard{padding:14px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.nowcard .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 4px 8px 10px;margin-bottom:6px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.stars button.on{color:var(--star)}

/* sheets e modais */
.back{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sheet .grab{display:flex;justify-content:center;padding-top:8px;flex:none}
.sheet .grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sh-t{display:flex;align-items:center;padding:6px 8px 0 20px;flex:none}
.sh-t h3{margin:0;font-size:19px;font-weight:800;line-height:1.25}
.sh-t small{display:block;font-size:13px;color:var(--muted);margin-top:2px;font-weight:500}
.sh-b{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 0}
.sh-f{flex:none;display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--line);background:var(--surface)}
.wide .back{align-items:center}
.wide .sheet{width:560px;max-height:86vh;border-radius:24px;border:1px solid var(--line)}
.wide .sheet.big{width:960px;height:744px;max-height:92vh}
.menurow{width:100%;border:0;background:none;min-height:56px;padding:0 20px;display:flex;align-items:center;gap:16px;font:700 15px 'Manrope',sans-serif;text-align:left;color:var(--text)}
.menurow.dng{color:var(--danger)}
.menurow small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.radiocard{display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:8px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.radiocard.sel{border:2px solid var(--accent);padding:13px}
.radiocard b{display:block;font-size:15px;font-weight:800}
.radiocard .d{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.rdot{width:22px;height:22px;flex:none;border-radius:11px;border:2px solid var(--line);margin-top:1px;background:var(--surface)}
.rdot.on{border:7px solid var(--accent)}
.sheet.big{height:92vh;height:92dvh}
.menurow .tick{width:22px;flex:none;display:flex;color:var(--accent)}
.crow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-top:1px solid var(--line)}
.group{border-radius:14px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.group .crow:first-child{border-top:0}
.gh{display:flex;align-items:baseline;gap:8px;padding:0 2px 6px}
.gh b{font-size:14px;font-weight:800}.gh span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:164px;transform:translateX(-50%);z-index:80;max-width:min(92vw,520px);background:var(--text);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.toast button{border:0;background:none;color:var(--bg);font:800 14px 'Manrope',sans-serif;height:44px;padding:0 12px;text-decoration:underline}
.wide .toast{bottom:32px}
.stat{flex:1;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font:800 20px 'JetBrains Mono',monospace}.stat span{font-size:12px;color:var(--muted)}
.day{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 2px 6px}
.lcover{width:64px;height:64px;flex:none;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
.lcover div{display:flex;align-items:center;justify-content:center;font:900 16px 'Noto Sans JP','Manrope',sans-serif;color:var(--text)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.wide .cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.wide .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wide .vgrid .vcard{margin:0}
.dim{opacity:.55}
.hidden{display:none!important}

</style>
</head>
<body>
<div id="app"></div>
<script>
const APP_VERSION="1.4.0",APP_BUILD=1793230916;
'use strict';
/* =====================================================================
   KaraTube · núcleo: utilidades, dados, códigos, busca, fila, histórico
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pad = (n, l) => String(n).padStart(l, '0');
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 9) + now().toString(36).slice(-4);
const fmtDay = ts => pad(new Date(ts).getDate(), 2) + '/' + pad(new Date(ts).getMonth() + 1, 2);
const fmtTime = ts => pad(new Date(ts).getHours(), 2) + ':' + pad(new Date(ts).getMinutes(), 2);
const fmtDate = ts => fmtDay(ts) + '/' + new Date(ts).getFullYear();
const dayStart = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const DAY = 86400000;
const uniq = a => Array.from(new Set(a));
const clone = o => JSON.parse(JSON.stringify(o));

const ICON = {
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  more: '<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>',
  qadd: '<path d="M4 6h10M4 11h10M4 16h6M17 13v6M14 16h6"/>',
  queue: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/>',
  filter: '<path d="M4 5h16l-6 7v6l-4 2v-8z"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  list: '<path d="M7 4h10v16l-5-3.5L7 20z"/>',

const store = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('sem IndexedDB'));
      const r = indexedDB.open('karatube', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  get(k) {
    if (storageMode === 'ls') { try { const v = localStorage.getItem('kt:' + k); return Promise.resolve(v ? JSON.parse(v) : undefined); } catch (e) { return Promise.resolve(undefined); } }
    return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  set(k, v) {
    if (storageMode === 'ls') { try { localStorage.setItem('kt:' + k, JSON.stringify(v)); } catch (e) { storageMode = 'mem'; } return Promise.resolve(); }

const isLatin = s => !/[^\u0000-ɏ‐-‧\s]/.test(s || '');
const titleField = (t, labelOrig = 'Título original', labelRoman = 'Título romanizado / traduzido') =>
  isLatin(t) ? { key: 'roman', label: labelRoman, value: t } : { key: 'title', label: labelOrig, value: t };

let mbChain = Promise.resolve();
function mbThrottle(fn) { // MusicBrainz: no máximo 1 pedido por segundo
  const run = mbChain.then(fn);
  mbChain = run.catch(() => { }).then(() => new Promise(r => setTimeout(r, 1100)));
  return run;
}
function jsonp(url, ms) {
  return new Promise((res, rej) => {
    const cb = 'kt_cb_' + uid(); const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('tempo esgotado')); }, ms || 9000);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error('falha de rede')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb; document.head.appendChild(s);
  });
}
const firstLines = (txt, n) => String(txt || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0, n).join('\n');

const SEARCH = {
  async musicbrainz(q) {
    const j = await mbThrottle(() => fetchJSON('https://musicbrainz.org/ws/2/recording?fmt=json&limit=3&query=' + encodeURIComponent(q)));
    const r = (j.recordings || [])[0]; if (!r) return null;
    const f = [titleField(r.title)];
    uniq((r['artist-credit'] || []).map(a => a.name)).forEach(n => f.push({ key: 'alias', label: 'Cantor (grafia)', value: n }));
    const y = (r['first-release-date'] || '').slice(0, 4); if (y) f.push({ key: 'year', label: 'Ano do primeiro lançamento', value: y });
    const rel = (r.releases || []).find(x => x.id); if (rel) f.push({ key: 'art', label: 'Capa do álbum', value: 'https://coverartarchive.org/release/' + rel.id + '/front-500' });
    return f;
  },
  async animethemes(q) {
    const j = await fetchJSON('https://api.animethemes.moe/search?fields[search]=animethemes&include[animetheme]=anime.images,song.artists&q=' + encodeURIComponent(q));
    const t = ((j.search || {}).animethemes || [])[0]; if (!t) return null;
    const f = [];
    if (t.song && t.song.title) f.push(titleField(t.song.title));
    const art = ((t.song || {}).artists || [])[0]; if (art && art.name) f.push({ key: 'alias', label: 'Cantor (grafia)', value: art.name });
    if (t.anime && t.anime.name) f.push({ key: 'origin', label: 'Origem', value: t.anime.name + (t.slug ? ' · ' + t.slug : '') });
    if (t.anime && t.anime.year) f.push({ key: 'year', label: 'Ano', value: String(t.anime.year) });
    const im = ((t.anime || {}).images || []); const img = im.find(x => /large/i.test(x.facet || '')) || im[0]; if (img && img.link) f.push({ key: 'art', label: 'Pôster do anime', value: img.link });
    return f;
  },
  async anilist(q) {
    const j = await fetchJSON('https://graphql.anilist.co', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ query: 'query($s:String){Media(search:$s,type:ANIME){title{romaji english native} seasonYear coverImage{large}}}', variables: { s: q } })
    });
    const m = j && j.data && j.data.Media; if (!m) return null;
    const f = [];
    if (m.title.romaji) f.push({ key: 'origin', label: 'Origem (anime)', value: m.title.romaji });
    if (m.seasonYear) f.push({ key: 'year', label: 'Ano', value: String(m.seasonYear) });
    if (m.coverImage && m.coverImage.large) f.push({ key: 'art', label: 'Pôster do anime', value: m.coverImage.large });
    return f;
  },
  async jikan(q) {
    const j = await fetchJSON('https://api.jikan.moe/v4/anime?limit=1&q=' + encodeURIComponent(q));
    const a = (j.data || [])[0]; if (!a) return null;
    const f = [{ key: 'origin', label: 'Origem (anime)', value: a.title }];
    if (a.year) f.push({ key: 'year', label: 'Ano', value: String(a.year) });
    const ai = a.images && a.images.jpg && (a.images.jpg.large_image_url || a.images.jpg.image_url); if (ai) f.push({ key: 'art', label: 'Pôster do anime', value: ai });
    return f;
  },
  async vocadb(q) {
    const j = await fetchJSON('https://vocadb.net/api/songs?maxResults=1&fields=Names,MainPicture&lang=Default&query=' + encodeURIComponent(q));
    const s = (j.items || [])[0]; if (!s) return null;
    const f = []; const names = s.names || [];
    const jp = names.find(n => n.language === 'Japanese'), ro = names.find(n => n.language === 'Romaji'), en = names.find(n => n.language === 'English');
    if (jp) f.push({ key: 'title', label: 'Título original', value: jp.value });
    if (ro || en) f.push({ key: 'roman', label: 'Título romanizado / traduzido', value: (ro || en).value });
    if (s.artistString) f.push({ key: 'alias', label: 'Cantor (grafia)', value: s.artistString.split(' feat.')[0] });
    if (s.publishDate) f.push({ key: 'year', label: 'Ano', value: s.publishDate.slice(0, 4) });
    const mp = s.mainPicture && (s.mainPicture.urlOriginal || s.mainPicture.urlThumb); if (mp) f.push({ key: 'art', label: 'Imagem da música', value: mp });
    return f;
  },
  async lrclib(q) {
    const j = await fetchJSON('https://lrclib.net/api/search?q=' + encodeURIComponent(q));
    const r = (j || []).find(x => x.plainLyrics); if (!r) return null;
    return [{ key: 'lyric', label: 'Letra inicial (5 linhas)', value: firstLines(r.plainLyrics, 5) }];
  },
  async itunes(q) {
    const j = await jsonp('https://itunes.apple.com/search?entity=song&limit=1&term=' + encodeURIComponent(q));
    const r = (j.results || [])[0]; if (!r) return null;
    const f = [titleField(r.trackName)];
    if (r.artistName) f.push({ key: 'alias', label: 'Cantor (grafia)', value: r.artistName });
    if (r.releaseDate) f.push({ key: 'year', label: 'Ano', value: r.releaseDate.slice(0, 4) });
    if (r.artworkUrl100) f.push({ key: 'art', label: 'Capa do álbum', value: r.artworkUrl100.replace(/\/\d+x\d+(bb)?\.(jpg|png)$/, '/600x600bb.$2') });
    return f;
  }
};
// consulta várias bases ao mesmo tempo; cada uma falha sozinha
async function searchBases(ids, q, onEach) {
  const out = {};
  await Promise.all(ids.map(async id => {
    try {
      const f = await SEARCH[id](q);
      out[id] = f && f.length ? { status: 'ok', fields: f } : { status: 'empty' };
    } catch (e) {
      out[id] = { status: 'error', msg: id === 'vocadb' ? 'O VocaDB pode bloquear acessos de sites novos. Tente outra base.' : 'Não consegui falar com esta base (sem internet ou ela bloqueou o acesso).' };
    }
    if (onEach) onEach(id, out[id]);
  }));
  return out;
}

/* ---- romanização (só japonês) via Kuroshiro, baixado na primeira vez ---- */
const KURO = { inst: null, loading: null, ready: false, stage: '' };
const hasJapanese = s => /[぀-ヿ㐀-鿿]/.test(s || '');
function withTimeout(p, ms, msg) { let t; return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg)), ms); })]).finally(() => clearTimeout(t)); }
function loadScript(src) {
  return withTimeout(new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao baixar a biblioteca')); document.head.appendChild(s); }), 30000, 'A biblioteca demorou demais para baixar');
}
const KURO_DICTS = ['dict/', 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/', 'https://unpkg.com/kuromoji@0.1.2/dict/'];
const KURO_FILES = ['base', 'cc', 'check', 'tid', 'tid_map', 'tid_pos', 'unk', 'unk_char', 'unk_compat', 'unk_invoke', 'unk_map', 'unk_pos'].map(n => n + '.dat.gz');
async function prefetchDict(base, onProg) {
  let done = 0, bytes = 0;
  for (const f of KURO_FILES) {
    let ok = false, lastE;
    for (let t = 0; t < 2 && !ok; t++) {
      const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 60000);
      try { const r = await fetch(base + f, { signal: ac.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); const b = await r.arrayBuffer(); bytes += b.byteLength; ok = true; }
      catch (e) { lastE = e; } finally { clearTimeout(to); }
    }
    if (!ok) throw new Error('Falha em ' + f + (lastE && lastE.name === 'AbortError' ? ' (demorou demais)' : ''));
    done++; onProg(done, KURO_FILES.length, bytes);
  }
}
async function toRomaji(text, onStage) {
  if (!hasJapanese(text)) throw new Error('nonjp');
  const stage = t => { KURO.stage = t; if (onStage) onStage(t); };
  if (!KURO.inst) {
    if (!KURO.loading) KURO.loading = (async () => {
      stage('Baixando biblioteca…');
      if (!window.Kuroshiro) await loadScript('https://cdn.jsdelivr.net/npm/kuroshiro@1.2.1/dist/kuroshiro.min.js');
      if (!window.KuromojiAnalyzer) await loadScript('https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js');
      const K = window.Kuroshiro.default || window.Kuroshiro;
      let lastErr;
      for (let i = 0; i < KURO_DICTS.length; i++) {
        try {
          stage(i ? 'Tentando outra fonte do dicionário…' : 'Baixando dicionário (~17 MB, só na 1ª vez)…');
          await prefetchDict(KURO_DICTS[i], (d, n, b) => stage('Baixando dicionário: ' + d + '/' + n + ' arquivos (' + (b / 1048576).toFixed(1) + ' de ~17 MB)…'));
          stage('Preparando o dicionário…');
          const k = new K();
          await withTimeout(k.init(new window.KuromojiAnalyzer({ dictPath: KURO_DICTS[i] })), 120000, 'O dicionário demorou demais para baixar');
          KURO.inst = k; KURO.ready = true; return;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Falha ao carregar o dicionário');
    })().catch(e => { KURO.loading = null; throw e; });
    await KURO.loading;
  }
  const r = await KURO.inst.convert(text, { to: 'romaji', mode: 'spaced', romajiSystem: 'hepburn' });
  return r.replace(/\s{2,}/g, ' ').trim().replace(/^./, c => c.toUpperCase());
}

/* ---- capa: reduz a imagem para uma miniatura guardada dentro do app ---- */
function shrinkImage(src, max) {
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.78));
      } catch (e) { rej(e); }
    };
    im.onerror = () => rej(new Error('imagem indisponível'));
    im.src = src;
  });
}

'use strict';
/* =====================================================================
   KaraTube · exportar, compartilhar e importar (com resumo de mesclagem)
   ===================================================================== */
const BACKUP_DAYS = 30;
function buildBackup() {
  return { app: 'karatube', v: 1, exportedAt: now(), device: devName(), songs: D.songs, versions: D.versions, lists: D.lists, history: D.history };
}
function backupName() {
  const d = new Date();
  return `karatube-${devName().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'aparelho'}-${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}.json`;
}
function markBackup() { D.settings.lastBackup = now(); D.settings.snoozeUntil = 0; save('settings'); }
function downloadFile(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
// "shared" | "downloaded" | "cancel"
async function shareBackup() {
  const json = JSON.stringify(buildBackup());
  const name = backupName();
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup do KaraTube', text: 'Backup do catálogo do KaraTube' });
      markBackup(); return 'shared';
    }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  downloadFile(name, json); markBackup(); return 'downloaded';
}
function saveBackupToDevice() { downloadFile(backupName(), JSON.stringify(buildBackup())); markBackup(); }
function backupDue() {
  const s = D.settings;
  if (!D.songs.length) return false;
  if (s.snoozeUntil && now() < s.snoozeUntil) return false;
  const ref = s.lastBackup || s.created || now();
  return now() - ref > BACKUP_DAYS * DAY;
}
const daysSinceBackup = () => D.settings.lastBackup ? Math.floor((now() - D.settings.lastBackup) / DAY) : null;

function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept || '.json,application/json'; i.style.display = 'none';
    i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); };
    i.oncancel = () => { i.remove(); res(null); };
    document.body.appendChild(i); i.click();
  });
}
function parseBackup(text) {
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error('Não consegui ler o arquivo. Ele é um backup do KaraTube?'); }
  if (!j || j.app !== 'karatube' || !Array.isArray(j.songs) || !Array.isArray(j.versions)) throw new Error('Este arquivo não parece um backup do KaraTube.');
  j.lists = Array.isArray(j.lists) ? j.lists : []; j.history = Array.isArray(j.history) ? j.history : [];
  return j;
}
function stable(o) { return JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v)) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v); }
const strip = o => { const c = Object.assign({}, o); delete c.updated; return stable(c); };
const sameWork = (a, b) => norm(a.title) === norm(b.title) && norm((a.singers || [])[0]) === norm((b.singers || [])[0]);

function planImport(j, filename) {
  const plan = { file: j, filename: filename || 'backup.json', novas: [], difs: [], iguais: 0, listsNew: 0, listsUpd: 0, histNew: 0 };
  j.songs.forEach(fs => {
    const fv = j.versions.filter(v => v.song === fs.id);
    const ls = X.song[fs.id];
    if (!ls) { plan.novas.push({ id: fs.id, song: fs, vers: fv, checked: true }); return; }
    const hv = X.vers[fs.id] || [];
    const sameS = strip(fs) === strip(ls);
    const sameV = fv.every(v => { const h = X.ver[v.code]; return h && strip(h) === strip(v); });
    if (sameS && sameV) { plan.iguais++; return; }
    plan.difs.push({
      id: fs.id, file: fs, here: ls, fvers: fv, hvers: hv, same: sameWork(fs, ls),
      choice: (fs.updated || 0) > (ls.updated || 0) ? 'file' : 'here'
    });
  });
  j.lists.forEach(l => { const h = D.lists.find(x => x.id === l.id); if (!h) plan.listsNew++; else if ((l.updated || 0) > (h.updated || 0)) plan.listsUpd++; });
  const have = new Set(D.history.map(h => h.id));
  plan.histNew = j.history.filter(h => !have.has(h.id)).length;
  return plan;
}
const sungOf = vs => vs.reduce((a, v) => a + (v.sung || 0), 0);
function describeSide(s, vs) {
  const parts = [];
  parts.push(vs.length + (vs.length === 1 ? ' versão' : ' versões'));
  const n = sungOf(vs); if (n) parts.push('cantada ' + n + (n === 1 ? ' vez' : ' vezes'));
  const r = vs.map(v => v.rating).filter(Boolean); if (r.length) parts.push('nota ' + Math.round(r.reduce((a, b) => a + b, 0) / r.length));
  parts.push('editada em ' + (s.updated ? fmtDay(s.updated) : '—'));
  return parts;
}
function applyImport(plan) {
  let added = 0, changed = 0;
  plan.novas.filter(n => n.checked).forEach(n => {
    D.songs.push(n.song); n.vers.forEach(v => D.versions.push(v)); added++;
  });
  plan.difs.forEach(d => {
    if (d.choice === 'file') {
      Object.assign(X.song[d.id], d.file);
      d.fvers.forEach(v => { const i = D.versions.findIndex(x => x.code === v.code); if (i >= 0) D.versions[i] = v; else D.versions.push(v); });
      changed++;
    } else if (d.choice === 'here') {
      d.fvers.forEach(v => { if (!X.ver[v.code]) D.versions.push(v); });
    } else if (d.choice === 'both') {
      const id = nextSongCode();
      const s2 = Object.assign({}, d.file, { id, updated: now() });
      D.songs.push(s2); // reindex abaixo; id novo já conta para o próximo código
      d.fvers.forEach(v => D.versions.push(Object.assign({}, v, { song: id, code: id + '-' + v.code.split('-')[1] })));
      reindex(); added++;
    }
    reindex();
  });
  plan.file.lists.forEach(l => {
    const i = D.lists.findIndex(x => x.id === l.id);
    if (i < 0) D.lists.push(l); else if ((l.updated || 0) > (D.lists[i].updated || 0)) D.lists[i] = l;
  });
  const have = new Set(D.history.map(h => h.id));
  plan.file.history.forEach(h => { if (!have.has(h.id)) D.history.push(h); });
  reindex(); save('songs', 'versions', 'lists', 'history');
  return { added, changed };
}

'use strict';
/* =====================================================================
   KaraTube · sincronização automática via GitHub (repositório privado)
   Arquivos no repositório de dados:
     catalogo.json                  músicas, versões, listas, histórico e "apagados"
     capas/<id>-<hash>.txt          capa da música (data URL), um arquivo por capa
   Mesclagem por registro: vence o mais recente (updated). Exclusões viajam como
   "tombstones" (D.sync.tomb). A fila e os ajustes NÃO são sincronizados.
   ===================================================================== */
const SYNC = { busy: false, timer: null, applying: false, lastTry: 0 };
const ghCfg = () => D.settings.gh || null;
const ghOn = () => { const g = ghCfg(); return !!(g && g.token && g.repo); };
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const b64 = t => { const u = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); };

async function gh(path, o) {
  const g = ghCfg(); o = o || {};
  const r = await fetch('https://api.github.com/repos/' + g.repo + path, {
    method: o.method || 'GET', cache: 'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + g.token, Accept: o.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, o.body ? { 'Content-Type': 'application/json' } : {}),
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return o.text ? r.text() : (r.status === 204 ? null : r.json());
}
function ghErrMsg(e) {
  if (!e) return 'Erro desconhecido.';
  if (e.status === 401) return 'Token inválido ou expirado. Gere outro no GitHub.';
  if (e.status === 403) return 'O GitHub recusou (limite de uso ou token sem permissão).';
  if (e.status === 404) return 'Repositório não encontrado, ou o token não tem acesso a ele.';
  if (e.message === 'Failed to fetch' || e.name === 'TypeError') return 'Sem conexão com o GitHub.';
  return 'Falha na sincronização: ' + (e.message || 'erro');
}

async function ghTree() {
  const g = ghCfg();
  if (!g.branch) { const info = await gh(''); g.branch = info.default_branch || 'main'; }
  try {
    const t = await gh('/git/trees/' + encodeURIComponent(g.branch) + '?recursive=1');
    const m = {}; (t.tree || []).forEach(x => { if (x.type === 'blob') m[x.path] = x.sha; }); return m;
  } catch (e) { if (e.status === 404 || e.status === 409) return {}; throw e; } // repositório vazio
}
const ghBlob = sha => gh('/git/blobs/' + sha, { accept: 'application/vnd.github.raw+json', text: true });
async function ghPut(path, text, sha, msg) {
  return gh('/contents/' + path.split('/').map(encodeURIComponent).join('/'), { method: 'PUT', body: { message: msg, content: b64(text), branch: ghCfg().branch, sha: sha || undefined } });
}

const sKey = (k, id) => k + ':' + id;
function localDeletions() {
  const known = D.sync.known || {}; const tomb = D.sync.tomb;
  const have = { s: new Set(D.songs.map(x => x.id)), v: new Set(D.versions.map(x => x.code)), l: new Set(D.lists.map(x => x.id)) };
  ['s', 'v', 'l'].forEach(k => (known[k] || []).forEach(id => { if (!have[k].has(id) && !tomb[sKey(k, id)]) tomb[sKey(k, id)] = now(); }));
}
const cmpForm = (k, x) => { if (k !== 's' || !x.art || !x.art.startsWith('data:')) return x; const c = Object.assign({}, x); c.artFile = 'capas/' + c.id + '-' + hashStr(c.art) + '.txt'; delete c.art; return c; };

  const me = devInfo(); if (!me) return false;
  const list = reg.devices = reg.devices || []; let changed = false;
  (D.settings.devDel || []).forEach(id => { const i = list.findIndex(x => x.id === id); if (i >= 0 && id !== me.id) { list.splice(i, 1); changed = true; } });
  D.settings.devDel = [];

async function ghSyncNow(manual) {
  if (!ghOn()) return; if (SYNC.busy) return;
  if (!navigator.onLine) { if (manual) toast('Sem internet. Tento de novo quando voltar.'); return; }
  SYNC.busy = true; SYNC.lastTry = now(); ui.syncMsg = 'Sincronizando…'; if (ui.tab === 'aju') render();
  const g = ghCfg(); let summary = '';
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const tree = await ghTree();
      let rem = { songs: [], versions: [], lists: [], history: [], tomb: {} }; const catSha = tree['catalogo.json'];
      if (catSha) rem = JSON.parse(await ghBlob(catSha));
      if (!g.last && (rem.songs || []).length && D.songs.length && !confirm('Este aparelho tem ' + D.songs.length + ' músicas e o GitHub já tem ' + rem.songs.length + '. Juntar os dois catálogos?')) { throw Object.assign(new Error('cancel'), { cancel: true }); }
      let reg = { devices: [] }; const regSha = tree['dispositivos.json'];
      if (regSha) { try { reg = JSON.parse(await ghBlob(regSha)); } catch (e) { reg = { devices: [] }; } }
      if (reconcileDevices(reg)) {
        try { await ghPut('dispositivos.json', JSON.stringify(reg, null, 1), regSha, 'Aparelhos · ' + devName()); }
        catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 2) continue; throw e; }
      }
      D.settings.devs = reg.devices;
      const oldArt = {}; D.songs.forEach(x => { if (x.art) oldArt[x.id] = x.art; });
      SYNC.applying = true;
      localDeletions();
      // capas vindas do GitHub
      const remArt = {}; (rem.songs || []).forEach(s => { if (s.artFile) remArt[s.id] = s; });
      const stat = mergeRemote(rem);
      for (const s of D.songs) {
        const rs = remArt[s.id];
        if (rs && !s.art && oldArt[s.id] && oldArt[s.id].startsWith('data:') && ('capas/' + s.id + '-' + hashStr(oldArt[s.id]) + '.txt') === rs.artFile) s.art = oldArt[s.id];
        if (rs && !s.art && tree[rs.artFile]) { try { s.art = await ghBlob(tree[rs.artFile]); stat.local++; } catch (e) { } }
        else if (rs && s.art && s.art.startsWith('data:') && ('capas/' + s.id + '-' + hashStr(s.art) + '.txt') !== rs.artFile && (rs.updated || 0) > (s.updated || 0) && tree[rs.artFile]) { try { s.art = await ghBlob(tree[rs.artFile]); stat.local++; } catch (e) { } }
      }
      D.songs.forEach(x => { delete x.artFile; });
      // capas novas daqui
      let up = 0;
      for (const s of D.songs) {
        if (s.art && s.art.startsWith('data:')) {
          const p = 'capas/' + s.id + '-' + hashStr(s.art) + '.txt';
          if (!tree[p]) { try { await ghPut(p, s.art, null, 'Capa ' + s.id); up++; } catch (e) { if (e.status !== 422) throw e; } }
        }
      }
      const needPut = !catSha || stat.remote > 0 || up > 0;
      if (needPut) {
        try { await ghPut('catalogo.json', serialize(), catSha, 'KaraTube · ' + devName()); }
        catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 2) { SYNC.applying = false; continue; } throw e; }
      }
      markKnown(); g.last = now(); g.err = ''; summary = stat.local ? 'Atualizado com ' + stat.local + (stat.local === 1 ? ' mudança' : ' mudanças') + ' do GitHub.' : 'Tudo em dia.';
      reindex(); save('songs', 'versions', 'lists', 'history', 'sync', 'settings');
      if (stat.local) { ui.songSel = ui.songSel && X.song[ui.songSel] ? ui.songSel : null; }
      break;
    }
    ui.syncMsg = summary; if (manual) toast(summary);
  } catch (e) {
    if (e.cancel) { ui.syncMsg = 'Sincronização cancelada.'; }
    else { g.err = ghErrMsg(e); ui.syncMsg = g.err; if (manual) toast(g.err, { ms: 5000 }); }
    save('settings');
  } finally { SYNC.busy = false; SYNC.applying = false; render(); }
}
function syncSoon(ms) { if (!ghOn()) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => ghSyncNow(false), ms || 10000); }

  <div class="pad" style="padding-bottom:8px"><div class="searchbox" style="opacity:.6">${ic('search', 20)}<span>Título, cantor, letra, origem…</span></div></div>

/* ---------- detalhe da música ---------- */
function vcard(v) {
  const s = songOf(v); const meta = [];
  meta.push(v.sung ? `Cantada ${v.sung}×` : 'Nunca cantada'); if (v.lastSung) meta.push('última em ' + fmtDay(v.lastSung));
  const mini = [v.key && 'Tom ' + v.key, v.voice, v.vtype, v.script].filter(Boolean).concat(v.tags || []);
  return `<div class="vcard">
    <div class="fx g12">${vthumb(s, v, 96, 54)}<div class="fx1">
      <div class="fx ac g8"><b class="mono" style="font-size:13px">${v.code}</b><span class="dot ${v.link || 'unverified'}"></span><span class="muted" style="font-size:12px">${linkLabel(v.link)}</span></div>
      <div class="muted ell" style="font-size:12px;margin-top:2px">${esc(v.channel || v.ytTitle || 'Sem canal')}</div>
      <div class="stars" style="gap:0;margin-top:2px">${v.rating ? stars(v.rating, 13) : '<span class="muted" style="font-size:11px">sem nota</span>'}</div></div></div>
    ${mini.length ? `<div class="chips" style="gap:6px;margin-top:10px">${mini.map(m => `<span class="mini">${esc(m)}</span>`).join('')}</div>` : ''}
    <div class="muted" style="font-size:12px;margin-top:8px">${meta.join(' · ')}${v.vnote ? ' · ' + esc(v.vnote) : ''}</div>
    <div class="fx g8" style="margin-top:10px">
      ${btn('Abrir no YouTube', 'openYT', { cls: 'primary grow', icon: 'play', d: { code: v.code } })}
      ${ib('tv', 'tv', 'Enviar para a TV', { cls: 'bd', s: 22, d: { code: v.code } })}
      ${ib('qadd', 'addVQ', 'Adicionar à fila', { cls: 'bd acc', d: { code: v.code } })}
      ${ib('more', 'verMenu', 'Mais ações da versão', { cls: 'bd', d: { code: v.code } })}
    </div></div>`;
}
function viewSong() {
  const s = X.song[ui.songSel]; const vs = X.vers[s.id] || [];
  const covers = D.songs.filter(x => x.coverOf === s.id);
  const dec = decadeOf(s.year);
  const meta = [s.lang, s.origin, s.year ? s.year + (dec ? ' · ' + dec : '') : ''].filter(Boolean);
  const top = `<div class="topbar">${ui.wide ? '<span style="width:12px"></span>' : ib('back', 'back', 'Voltar', { sw: 2.2 })}<h2 class="mono" style="font-size:14px;color:var(--muted)">${s.id}</h2>
    <button class="ib" style="color:${s.fav ? 'var(--star)' : 'var(--muted)'}" data-act="fav" data-id="${s.id}" aria-label="Favoritar">${s.fav ? starFill(26) : ic('star', 26)}</button>${ib('more', 'songMenu', 'Mais ações da música', { d: { id: s.id } })}</div>`;
  const lyr = s.lyric || s.lyricRoman || s.note;
  return `${top}<div class="scroll pad" data-sk="song" style="padding-top:8px;padding-bottom:16px">
    <div class="fx g12" style="align-items:flex-start">${s.art ? `<img src="${esc(s.art)}" alt="Capa" style="width:${ui.wide ? 132 : 104}px;height:${ui.wide ? 132 : 104}px;object-fit:cover;border-radius:14px;flex:none;background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.18)" onerror="this.remove()">` : ''}
    <div class="fx1" style="min-width:0"><div style="font-size:24px;font-weight:800;line-height:1.25" class="jp">${esc(s.title)}</div>
    ${s.roman ? `<div class="muted" style="font-size:15px;margin-top:2px">${esc(s.roman)}</div>` : ''}
    <div style="font-size:16px;font-weight:700;margin-top:8px" class="jp">${esc(singersStr(s))}</div></div></div>
    ${meta.length ? `<div class="chips" style="gap:6px;margin-top:10px">${meta.map(m => `<span class="mini">${esc(m)}</span>`).join('')}</div>` : ''}
    ${s.coverOf ? `<div style="margin-top:10px">${X.song[s.coverOf] ? `<button class="btn sm" data-act="openSong" data-id="${s.coverOf}">${coverText(s)}</button>` : `<span class="muted" style="font-size:13px">${coverText(s)}</span>`}</div>` : ''}
    ${covers.length ? `<div class="muted" style="font-size:12px;margin-top:10px">Covers: ${covers.map(c => `<button class="btn text sm" style="padding:0 6px;height:32px;display:inline-flex;color:var(--accent)" data-act="openSong" data-id="${c.id}">${c.id}</button>`).join('')}</div>` : ''}
    <div class="fx ac" style="margin:18px 0 8px"><b style="font-size:16px;flex:1">Versões (${vs.length})</b>${btn('Nova versão', 'newVersion', { cls: 'outline sm', icon: 'plus', is: 18, d: { id: s.id } })}</div>
    <div class="vgrid">${vs.map(vcard).join('')}</div>
    <details class="box" style="margin-top:10px"><summary>Letra inicial e nota pessoal ${lyr ? '' : '<span class="muted" style="font-weight:500;margin-left:6px">(vazio)</span>'}</summary>
      <div style="padding-bottom:14px;font-size:14px;line-height:1.55">
        ${s.lyric ? `<div class="muted" style="font-size:12px;font-weight:700">Original</div><div class="jp" style="white-space:pre-wrap">${esc(s.lyric)}</div>` : ''}
        ${s.lyricRoman ? `<div class="muted" style="font-size:12px;font-weight:700;margin-top:8px">Romanizada ou traduzida</div><div style="white-space:pre-wrap">${esc(s.lyricRoman)}</div>` : ''}
        ${s.note ? `<div class="muted" style="font-size:12px;font-weight:700;margin-top:8px">Nota pessoal</div><div style="white-space:pre-wrap">${esc(s.note)}</div>` : ''}
        ${lyr ? '' : '<span class="muted">Preencha em Editar música.</span>'}
      </div></details>
  </div>`;
}

/* ---------- fila ---------- */
function ratingBtns() {
  return `<div class="stars" role="group" aria-label="Nota da música, opcional">${[1, 2, 3, 4, 5].map(n => `<button class="${n <= ui.nowRating ? 'on' : ''}" data-act="rate" data-n="${n}" aria-label="Nota ${n}">${n <= ui.nowRating ? starFill(26) : ic('star', 26)}</button>`).join('')}</div>`;
}
function queueFull(noHead) {
  const cur = qCurrent();
  let h = noHead ? '' : `<div class="pad" style="padding-top:18px;padding-bottom:6px"><div style="font-size:22px;font-weight:800">Fila</div><div class="muted" style="font-size:13px">${cur ? `1 agora · ${D.queue.length - 1} na espera` : 'vazia'}</div></div>`;
  if (!cur) return h + `<div class="empty"><div class="big" style="width:88px;height:88px;border-radius:44px">${ic('queue', 40, 1.6)}</div><h3 style="font-size:18px">Fila vazia</h3><p>Toque no ícone de fila de uma música para adicionar aqui.</p></div>`;
  const s = songOf(cur);
  h += `<div class="scroll pad" data-sk="queue" style="padding-top:8px;padding-bottom:12px">
   <div class="nowcard"><div class="fx ac"><div class="k fx1">AGORA</div><button class="ib" style="width:36px;height:36px;color:${s.fav ? 'var(--star)' : 'var(--muted)'}" data-act="fav" data-id="${s.id}" aria-label="Favoritar">${s.fav ? starFill(24) : ic('star', 24)}</button></div>
    <div class="fx g12" style="margin-top:8px">${vthumb(s, cur, 112, 63, 10)}<div class="fx1"><div class="jp" style="font-size:16px;font-weight:700;line-height:1.25">${esc(s.title)}</div><div class="mono muted" style="font-size:12px;margin-top:2px">${esc((s.singers || [])[0] || '')} · ${cur.code}</div>
      <div class="fx ac g6" style="margin-top:4px"><span class="dot ${cur.link || 'unverified'}"></span><span class="muted" style="font-size:12px">${linkLabel(cur.link)}</span></div></div></div>
    ${[cur.key && 'Tom ' + cur.key, cur.voice].filter(Boolean).length ? `<div class="chips" style="gap:6px;margin-top:8px">${[cur.key && 'Tom ' + cur.key, cur.voice].filter(Boolean).map(m => `<span class="mini">${esc(m)}</span>`).join('')}</div>` : ''}
    <div class="fx g8" style="margin-top:12px">${btn('Abrir no YouTube', 'openYT', { cls: 'primary grow lg', icon: 'play', d: { code: cur.code } })}${ib('tv', 'tv', 'Enviar para a TV', { cls: 'bd', s: 22 })}</div>
    <div class="fx col ac" style="margin-top:6px"><div class="muted" style="font-size:11px;font-weight:700">Nota (opcional)</div>${ratingBtns()}</div>
    <button class="btn text" style="width:100%;color:${cur.link === 'broken' ? 'var(--danger)' : 'var(--muted)'}" data-act="broken">${ic('warn', 18)}${cur.link === 'broken' ? 'Link marcado como quebrado · desfazer' : 'Link quebrado (continua na fila)'}</button>
    <div class="fx g8" style="margin-top:6px">${btn('Cantei', 'sung', { cls: 'ok grow lg', icon: 'check' })}${btn('Não cantei', 'skip', { cls: 'grow lg', icon: 'close' })}</div>
   </div>`;
  const rest = D.queue.slice(1);
  h += `<div class="muted" style="font-size:12px;font-weight:700;margin:16px 0 8px">PRÓXIMAS${rest.length ? '' : ' · nenhuma'}</div>`;
  h += rest.map((e, i) => {
    const v = X.ver[e.code]; if (!v) return ''; const so = songOf(v);
    return `<div class="qrow">${thumbHtml(so, v, 40, 18, 8)}<div class="fx1"><div class="ell jp" style="font-size:14px;font-weight:700">${esc(so.title)}</div><div class="ell mono muted" style="font-size:12px">${esc((so.singers || [])[0] || '')} · ${v.code}</div></div>
      ${i > 0 ? ib('up', 'qUp', 'Tocar a seguir', { s: 20, d: { q: e.q } }) : ''}${ib('close', 'qRm', 'Tirar da fila', { s: 20, d: { q: e.q } })}</div>`;
  }).join('');
  h += `<div class="fx g8" style="margin-top:10px">${btn('Limpar fila', 'qClear', { cls: 'text sm' })}${btn('Salvar como lista', 'qToList', { cls: 'sm' })}</div></div>`;
  return h;
}

/* ---------- ações do núcleo ligadas à interface ---------- */
function cantei() {
  const v = sung(); if (!v) return;
  toast('Cantada: ' + songOf(v).title);
  ui.nowKey = null; render();
}
function pular() { if (!D.queue.length) return; skipCurrent(); ui.nowKey = null; render(); }
function addSongToQueue(songId) {
  const vs = X.vers[songId] || [];
  if (!vs.length) return toast('Esta música ainda não tem versão.');
  if (vs.length === 1) { qAdd(vs[0].code); toast('Na fila: ' + X.song[songId].title); render(); }
  else { ui.sheets.push({ type: 'pickVer', songId }); render(); }
}

'use strict';
/* =====================================================================
   KaraTube · interface (parte 2): cadastro/edição, listas, histórico,
   ajustes, primeira abertura
   ===================================================================== */
const VOICES = ['Original', 'Feminina', 'Masculina', 'Dueto'];
const VTYPES = ['Karaokê com guia', 'Só instrumental', 'Letra na tela', 'Clipe', 'Ao vivo'];
const SCRIPTS = ['Kanji + furigana', 'Kanji', 'Romaji', 'Hiragana', 'Português'];
const LANGS = ['Japonês', 'Português', 'Inglês', 'Coreano', 'Outro'];
const KEY_DEFAULTS = ['Tom original', '−2', '+2', '−4', '+4'];

/* ---------- rascunho ---------- */
function newDraft(mode, o) {
  return Object.assign({
    mode, scope: 'song', songCode: null, verCode: null, ret: null,
    title: '', roman: '', singer: '', aliases: [], coverOf: '', lang: '', origin: '', year: '', lyric: '', lyricRoman: '', note: '', art: '',
    url: '', vid: '', ytTitle: '', channel: '', ytState: 'idle', dupIgnored: false,
    key: '', voice: '', vtype: '', script: '', tags: [], link: 'unverified', rating: 0, vnote: '', songQ: '', busyRomaji: false
  }, o || {});
}
function loadSongInto(d, s) {
  d.title = s.title || ''; d.roman = s.roman || ''; d.singer = (s.singers || [])[0] || ''; d.aliases = (s.singers || []).slice(1);
  d.coverOf = s.coverOf || ''; d.lang = s.lang || ''; d.origin = s.origin || ''; d.year = s.year || '';
  d.lyric = s.lyric || ''; d.lyricRoman = s.lyricRoman || ''; d.note = s.note || ''; d.art = s.art || '';
}
function loadVerInto(d, v) {
  d.verCode = v.code; d.url = v.url || ''; d.vid = v.vid || ''; d.ytTitle = v.ytTitle || ''; d.channel = v.channel || ''; d.ytState = v.vid ? 'ok' : 'idle';
  d.key = v.key || ''; d.voice = v.voice || ''; d.vtype = v.vtype || ''; d.script = v.script || ''; d.tags = (v.tags || []).slice();
  d.link = v.link || 'unverified'; d.rating = v.rating || 0; d.vnote = v.vnote || '';
}
function startNew() { ui.draft = newDraft('new'); ui.tab = 'cad'; render(); }
function startVersion(songId) { ui.draft = newDraft('version', { songCode: songId, ret: { tab: 'cat', songSel: songId } }); ui.tab = 'cad'; render(); }
function startEdit(songId, scope, verCode) {
  const s = X.song[songId]; const d = newDraft('edit', { songCode: songId, scope: scope || 'song', ret: { tab: 'cat', songSel: songId } });
  loadSongInto(d, s);
  const v = verCode ? X.ver[verCode] : (X.vers[songId] || [])[0]; if (v) loadVerInto(d, v);
  ui.draft = d; ui.tab = 'cad'; render();
}

/* ---------- peças do formulário ---------- */
const fld = (name, label, o = {}) => `${label ? lbl(label, o.first) : ''}<div class="field"><input id="f-${name}" data-f="${name}" value="${esc(ui.draft[name])}" placeholder="${esc(o.ph || '')}" autocomplete="off" autocapitalize="off" ${o.type ? `type="${o.type}"` : ''} ${o.im ? `inputmode="${o.im}"` : ''} style="${o.mono ? "font-family:'JetBrains Mono',monospace;font-size:14px" : o.jp ? "font-family:'Noto Sans JP','Manrope',sans-serif;font-size:16px" : ''}"></div>`;
const areaF = (name, label, ph, rows) => `${lbl(label)}<div class="area"><textarea id="f-${name}" data-f="${name}" rows="${rows || 3}" placeholder="${esc(ph)}">${esc(ui.draft[name])}</textarea></div>`;
function chipsPick(field, options) {
  const cur = ui.draft[field];
  const all = options.includes(cur) || !cur ? options : options.concat([cur]);
  return `<div class="chips">${all.map(o => chipB(esc(o), 'pick', cur === o, { f: field, v: o })).join('')}</div>`;
}
function sugList(field) {
  const d = ui.draft; let typed, pool;
  if (field === 'origin') { typed = d.origin; pool = songValues(s => s.origin); }
  else if (field === 'key') { typed = d.key; pool = uniq(allValues(v => [v.key]).concat(KEY_DEFAULTS)); }
  else if (field === 'tag') { typed = (document.getElementById('f-tagIn') || {}).value || ''; pool = allValues(v => v.tags || []).filter(t => !d.tags.includes(t)); }
  else if (field === 'singer') { typed = d.singer; pool = songValues(s => (s.singers || [])[0]); }
  const t = norm(typed);
  const list = pool.filter(x => norm(x) !== t && (!t || norm(x).includes(t))).slice(0, 6);
  if (!list.length) return '';
  return `<small>Já usadas:</small>${list.map(x => `<button class="sug" data-act="sugFill" data-f="${field}" data-v="${esc(x)}"><span>${esc(x)}</span></button>`).join('')}`;
}
const sugBox = f => `<div class="sugrow" id="sug-${f}">${sugList(f)}</div>`;
function updSug(f) { const e = document.getElementById('sug-' + f); if (e) e.innerHTML = sugList(f); }
function coverResults() {
  const d = ui.draft; const t = norm(d.coverOf);
  if (t.length < 2 || /^\d{6}$/.test(d.coverOf.trim())) {
    const o = X.song[d.coverOf.trim()];
    return o ? `<div class="hint">→ <b class="jp">${esc(o.title)}</b> · ${esc(singersStr(o))}</div>` : '';
  }
  const res = D.songs.filter(s => s.id !== d.songCode && (X.text[s.id] || '').includes(t)).slice(0, 4);
  if (!res.length) return `<div class="hint">Nenhuma música com esse texto. Vai ficar como texto livre.</div>`;
  return `<div class="group" style="margin:6px 0 0">${res.map(s => `<div class="crow" style="min-height:52px"><div class="fx1"><div class="ell jp" style="font-weight:700;font-size:14px">${esc(s.title)}</div><div class="mono muted" style="font-size:12px">${s.id} · ${esc(singersStr(s))}</div></div>${btn('Escolher', 'covPick', { cls: 'primary sm', d: { id: s.id } })}</div>`).join('')}</div>`;
}
function ytBox(d) {
  if (!d.url) return '';
  if (!d.vid) return `<div class="hint" style="color:var(--danger)">Não reconheci este link do YouTube.</div>`;
  const st = d.ytState;
  const stTxt = st === 'loading' ? '<span class="spin"></span> Buscando no YouTube…' : st === 'ok' ? '✓ Preenchido pelo YouTube' : st === 'error' ? 'Não consegui ler o vídeo (sem internet?). Dá para preencher à mão.' : '';
  return `<div class="card fx g12" style="margin:10px 0 0;padding:10px"><div class="thumb" style="width:96px;height:54px;border-radius:8px;background:var(--surface2)"><img src="${thumbUrl(d.vid)}" alt="" onerror="this.remove()"></div>
    <div class="fx1"><div class="jp" style="font-size:13px;font-weight:700;line-height:1.3;max-height:34px;overflow:hidden">${esc(d.ytTitle || '')}</div><div class="muted" style="font-size:12px;margin-top:2px">${esc(d.channel || '')}</div><div style="font-size:11px;font-weight:700;margin-top:4px;color:${st === 'ok' ? 'var(--ok)' : 'var(--muted)'}">${stTxt}</div></div></div>`;
}
function dupBox(d) {
  const other = d.vid && (X.vid[d.vid] || []).find(v => v.code !== d.verCode);
  if (!other || d.dupIgnored) return '';
  const s = songOf(other);
  return `<div class="warn"><div class="fx ac g8" style="font-size:15px;font-weight:800"><span style="color:var(--star);display:flex">${ic('warn', 22)}</span>Esta URL já está no catálogo</div>
    <div class="fx g12" style="margin-top:12px;padding:10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)">${thumbHtml(s, other, 56, 26, 10)}<div class="fx1"><div class="mono" style="font-size:12px;font-weight:600">${other.code}</div><div class="ell jp" style="font-size:14px;font-weight:700;margin-top:2px">${esc(s.title)}</div><div class="muted" style="font-size:12px;margin-top:2px">${esc(other.channel || '')} · ${other.sung ? 'cantada ' + other.sung + '×' : 'nunca cantada'}${other.lastSung ? ' · última em ' + fmtDay(other.lastSung) : ''}</div></div></div>
    <div class="col g8" style="margin-top:12px">${btn('Abrir ' + other.code, 'openDup', { cls: 'primary', d: { id: s.id } })}${btn('Cadastrar mesmo assim', 'dupIgnore')}${btn('Limpar a URL', 'clearUrl', { cls: 'text' })}</div></div>`;
}
function secUrl(d) {
  return `${lbl('URL do YouTube', true)}<div class="fx g8"><div class="field fx1"><input id="f-url" data-f="url" value="${esc(d.url)}" placeholder="Cole o link aqui" inputmode="url" autocomplete="off" autocapitalize="off" style="font-family:'JetBrains Mono',monospace;font-size:14px"></div>
    <button class="ib bd acc" style="width:48px;height:48px" data-act="refreshYT" aria-label="Atualizar dados do YouTube">${ic('refresh', 22)}</button></div>
    <div id="ytbox">${ytBox(d)}</div><div id="dupbox">${dupBox(d)}</div>`;
}
function secSong(d) {
  const lines = (s) => String(s || '').split(/\r?\n/).filter(x => x.trim()).length;
  return `${fld('title', 'Título original', { jp: true, ph: 'Como aparece no vídeo ou na música' })}
  ${lbl('Título romanizado / traduzido')}<div class="fx g8"><div class="field fx1"><input id="f-roman" data-f="roman" value="${esc(d.roman)}" placeholder="Digite ou gere" autocomplete="off"></div>
    <button class="btn" style="height:48px;padding:0 12px;font-size:12px" data-act="romaji" ${d.busyRomaji ? 'disabled' : ''}>${d.busyRomaji ? '<span class="spin"></span> ' + esc(d.romajiStage ? 'Aguarde…' : 'Carregando…') : ic('trans', 18) + ' Gerar romaji'}</button></div>
  <div class="hint">${d.busyRomaji && d.romajiStage ? esc(d.romajiStage) : 'Gera só a partir de japonês. Sempre dá para editar.'}</div>
  ${fld('singer', 'Cantor', { jp: true })}${sugBox('singer')}
  ${lbl('Outras grafias do cantor')}
  <div class="field" style="flex-wrap:wrap;gap:6px;padding:6px 10px"><span class="fx wrap g6 ac" id="aliases">${d.aliases.map((a, i) => `<span class="tag">${esc(a)}<button data-act="rmAlias" data-i="${i}" aria-label="Remover ${esc(a)}">${ic('close', 16)}</button></span>`).join('')}</span>
    <input id="f-aliasIn" data-enter="addAlias" placeholder="+ grafia (Enter)" style="flex:1;min-width:110px;border:0;outline:0;background:transparent;font:500 14px 'Manrope','Noto Sans JP',sans-serif;height:36px"></div>
  ${lbl('Cover de · código ou texto livre')}<div class="field">${ic('search', 20)}<input id="f-coverOf" data-f="coverOf" value="${esc(d.coverOf)}" placeholder="Ex.: 000001 ou nome da original" autocomplete="off"></div><div id="covres">${coverResults()}</div>
  ${lbl('Idioma')}${chipsPick('lang', LANGS)}

/* ---------- gravar o rascunho ---------- */
function cleanLyric(t) { return String(t || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean).slice(0, 5).join('\n'); }
function songFromDraft(d, base) {
  const s = base || { id: '', created: now(), fav: false };
  s.title = d.title.trim(); s.roman = d.roman.trim(); s.singers = [d.singer.trim()].concat(d.aliases).filter(Boolean);
  s.coverOf = d.coverOf.trim(); s.lang = d.lang; s.origin = d.origin.trim(); s.year = String(d.year || '').trim();
  s.lyric = cleanLyric(d.lyric); s.lyricRoman = cleanLyric(d.lyricRoman); s.note = d.note.trim(); s.art = d.art || ''; s.updated = now();
  return s;
}
function verFromDraft(d, v) {
  v.url = d.url.trim(); v.vid = d.vid; v.ytTitle = d.ytTitle; v.channel = d.channel;
  v.key = d.key.trim(); v.voice = d.voice; v.vtype = d.vtype; v.script = d.script; v.tags = d.tags.slice();
  v.link = d.link; v.rating = d.rating; v.vnote = d.vnote.trim(); v.updated = now();
  return v;
}
function saveDraft() {
  const d = ui.draft; if (!d) return;
  const needSong = d.mode === 'new' || (d.mode === 'edit' && d.scope === 'song');
  const needVer = d.mode !== 'edit' || d.scope === 'version';
  if (d.mode === 'version' && !(d.songCode && X.song[d.songCode])) return toast('Escolha a música desta versão.');
  if (needSong && !d.title.trim()) return toast('Falta o título original.');
  if (needSong && !d.singer.trim()) return toast('Falta o cantor.');
  if (needVer && !d.vid) return toast(d.url ? 'Não reconheci o link do YouTube.' : 'Falta a URL do YouTube.');
  if (needVer && !d.dupIgnored && (X.vid[d.vid] || []).some(v => v.code !== d.verCode)) return toast('Esta URL já está no catálogo. Escolha uma opção no aviso.');
  let songId = d.songCode, msg;
  try {
    if (d.mode === 'new') {
      const s = songFromDraft(d); s.id = nextSongCode(); D.songs.push(s); songId = s.id;
      const v = verFromDraft(d, { code: s.id + '-01', song: s.id, sung: 0, lastSung: null, created: now() }); D.versions.push(v); msg = 'Salvo: ' + v.code;
    } else if (d.mode === 'version') {
      const v = verFromDraft(d, { code: nextVersionCode(songId), song: songId, sung: 0, lastSung: null, created: now() }); D.versions.push(v);
      X.song[songId].updated = now(); msg = 'Salvo: ' + v.code;
    } else {
      if (needSong) songFromDraft(d, X.song[songId]);
      if (needVer) verFromDraft(d, X.ver[d.verCode]);
      msg = 'Alterações salvas';
    }
  } catch (e) { return toast(e.message || 'Não consegui salvar.'); }
  reindex(); save('songs', 'versions');
  ui.draft = null; ui.tab = 'cat'; ui.songSel = songId; toast(msg); render();
}
function cancelDraft() {
  const r = ui.draft && ui.draft.ret;
  ui.draft = null;
  if (r) { ui.tab = r.tab; ui.songSel = r.songSel; } else ui.tab = 'cat';
  render();
}
async function loadYT(force) {
  const d = ui.draft; if (!d || !d.vid) return;
  const vid = d.vid; d.ytState = 'loading'; refreshYtBox();
  try {
    const r = await oembed(vid);
    if (!ui.draft || ui.draft.vid !== vid) return;
    d.ytTitle = r.title; d.channel = r.channel; d.ytState = 'ok';
    const hasSongFields = d.mode === 'new' || (d.mode === 'edit' && d.scope === 'song');
    if (hasSongFields && !d.title.trim()) d.title = cleanTitle(r.title);
    render();
  } catch (e) { if (ui.draft && ui.draft.vid === vid) { d.ytState = 'error'; refreshYtBox(); } }
}
function refreshYtBox() { const a = $('#ytbox'), b = $('#dupbox'); if (a && ui.draft) { a.innerHTML = ytBox(ui.draft); if (b) b.innerHTML = dupBox(ui.draft); } }
function onUrlInput() {
  const d = ui.draft; const vid = parseVid(d.url);
  if (vid !== d.vid) { d.vid = vid; d.dupIgnored = false; d.ytState = 'idle'; d.ytTitle = ''; d.channel = ''; }
  refreshYtBox();
  if (vid) loadYT();
}

'use strict';
/* =====================================================================

const sh = () => ui.sheets[ui.sheets.length - 1];
const shHead = (t, sub) => `<div class="sh-t"><div class="fx1"><h3>${t}</h3>${sub ? `<small>${sub}</small>` : ''}</div>${ib('close', 'closeSheet', 'Fechar')}</div>`;
const shFoot = inner => `<div class="sh-f">${inner}</div>`;
const rcard = (sel, title, desc, act, d, extra) => `<div class="radiocard ${sel ? 'sel' : ''}" role="radio" aria-checked="${!!sel}" tabindex="0" data-act="${act}" ${dataAttrs(d)}><span class="rdot ${sel ? 'on' : ''}"></span><span class="fx1"><b>${title}</b><span class="d">${desc}</span>${extra || ''}</span></div>`;
const menuRow = (icon, text, act, d, o = {}) => `<button class="menurow ${o.dng ? 'dng' : ''}" data-act="${act}" ${dataAttrs(d)}>${ic(icon, 22)}<span class="fx1">${text}${o.sub ? `<small>${o.sub}</small>` : ''}</span></button>`;
const checkRow = (title, sub, checked, change, d, o = {}) => `<label class="crow" style="${o.dim ? 'opacity:.55' : ''}"><input type="checkbox" data-change="${change}" ${dataAttrs(d)} ${checked ? 'checked' : ''} ${o.dis ? 'disabled' : ''} aria-label="${esc(title)}"><span class="fx1"><b class="jp ell" style="display:block;font-size:15px">${esc(title)}</b><span class="muted" style="display:block;font-size:12px">${sub}</span></span></label>`;

const SHEETS = {};
function sheetHtml() {
  const t = sh(); if (!t) return '';

SHEETS.queue = () => ({

});

SHEETS.sort = () => ({

   <div class="pad" style="padding-top:8px;padding-bottom:16px"><div class="seg">${[['asc', 'Crescente'], ['desc', 'Decrescente']].map(x => `<button class="${ui.dir === x[0] ? 'sel' : ''}" data-act="setDir" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>`

SHEETS.filters = t => {
  const f = t.f; const cnt = D.songs.filter(s => matchSong(s, ui.query, f)).length;
  const sec = (title, inner) => `<div style="margin-bottom:14px"><div class="lbl" style="margin:0 0 6px">${title}</div>${inner}</div>`;
  const chips = (field, opts, label) => `<div class="chips">${opts.map(o => chipB(esc(label ? label(o) : o), 'fSet', f[field] === o, { f: field, v: o })).join('')}</div>`;
  const langs = uniq(songValues(s => s.lang).concat(LANGS.slice(0, 3)));
  const origins = songValues(s => s.origin).slice(0, 8);
  const voices = uniq(VOICES.concat(allValues(v => [v.voice])));
  const vtypes = uniq(VTYPES.concat(allValues(v => [v.vtype])));
  const tags = allValues(v => v.tags || []).slice(0, 14);
  return {
    label: 'Filtros',
    html: `<div class="sh-t"><div class="fx1"><h3>Filtros</h3></div>${btn('Limpar', 'fClear', { cls: 'text' })}${ib('close', 'closeSheet', 'Fechar')}</div>
    <div class="sh-b" style="padding-top:12px">
      ${sec('Mostrar', `<div class="chips">${[['all', 'Todas'], ['fav', '★ Favoritas'], ['never', 'Nunca cantadas']].map(x => chipB(x[1], 'fSet', f.show === x[0], { f: 'show', v: x[0] })).join('')}</div>`)}
      ${sec('Idioma', chips('lang', langs))}
      ${origins.length ? sec('Origem', chips('origin', origins)) : ''}
      ${sec('Voz', chips('voice', voices))}
      ${sec('Tipo de vídeo', chips('vtype', vtypes))}
      ${tags.length ? sec('Tags', `<div class="chips">${tags.map(x => chipB(esc(x), 'fTag', f.tags.includes(x), { v: x })).join('')}</div>`) : ''}
      ${sec('Status do link', `<div class="chips">${[['', 'Qualquer'], ['ok', 'Funcionando'], ['unverified', 'Não verificado'], ['broken', 'Quebrado']].map(x => chipB(x[1], 'fSet', f.link === x[0], { f: 'link', v: x[0] })).join('')}</div>`)}
      ${sec('Nota mínima', `<div class="rate">${[1, 2, 3, 4, 5].map(n => `<button class="${f.minRating === n ? 'sel' : ''}" data-act="fSet" data-f="minRating" data-v="${n}">${n}</button>`).join('')}</div>`)}
    </div>${shFoot(btn(`Mostrar ${cnt} ${cnt === 1 ? 'música' : 'músicas'}`, 'fApply', { cls: 'primary grow lg' }))}`
  };
};

SHEETS.jump = t => {
  const m = jumpMatch(t.v || '');
  return {
    label: 'Ir ao número',
    html: shHead('Ir direto ao número', 'Digite o código, com ou sem a versão') + `<div class="sh-b" style="padding-top:12px"><div class="field"><input id="jumpIn" data-autofocus="jump" inputmode="numeric" autocomplete="off" placeholder="000001 ou 000001-02" value="${esc(t.v || '')}" style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700"></div>
    <div id="jumpres" style="margin-top:10px;min-height:64px">${jumpResHtml(m)}</div></div>${shFoot(btn('Ir', 'jumpGo', { cls: 'primary grow lg', dis: !m }))}`
  };
};
function jumpMatch(v) {
  const m = String(v).trim().match(/^(\d{1,6})(?:-(\d{1,2}))?$/); if (!m) return null;
  const id = pad(m[1], 6); const s = X.song[id]; if (!s) return null;
  const ver = m[2] ? X.ver[id + '-' + pad(m[2], 2)] : null;
  return { s, ver };
}
const jumpResHtml = m => m ? `<div class="srow" style="margin:0;cursor:default">${thumbHtml(m.s, m.ver || bestVersion(m.s.id), 48, 22, 10)}<div class="fx1"><div class="ell jp t">${esc(m.s.title)}</div><div class="r ell">${esc(singersStr(m.s))} · <span class="mono">${m.ver ? m.ver.code : m.s.id}</span></div></div></div>` : '<div class="hint">Nenhuma música com esse número.</div>';

SHEETS.pickVer = t => {
  const s = X.song[t.songId]; const vs = X.vers[t.songId] || [];
  return {
    label: 'Escolher versão',
    html: shHead('Qual versão?', esc(s.title)) + `<div class="sh-b" style="padding-top:12px;padding-bottom:16px">${vs.map(v => `<div class="vcard" style="margin-bottom:8px"><div class="fx ac g12">${vthumb(s, v, 80, 45)}<div class="fx1"><div class="fx ac g8"><b class="mono" style="font-size:13px">${v.code}</b><span class="dot ${v.link || 'unverified'}"></span></div><div class="muted" style="font-size:12px;margin-top:2px">${[v.key && 'Tom ' + v.key, v.voice, v.vtype].filter(Boolean).map(esc).join(' · ') || esc(v.channel || '')}</div></div>${btn('Adicionar', 'addVQ', { cls: 'primary sm', d: { code: v.code } })}</div></div>`).join('')}</div>`
  };
};

SHEETS.songMenu = t => {

  return {

    html: `<div class="sh-t"><div class="fx1"><h3 class="jp">${esc(s.title)}<small>${s.id} · ${esc(singersStr(s))}</small></h3></div>${ib('close', 'closeSheet', 'Fechar')}</div>
    <div style="padding:6px 0 10px;overflow-y:auto">

      <div style="height:1px;background:var(--line);margin:4px 20px"></div>
      ${menuRow('trash', 'Excluir música', 'delSong', { id: s.id }, { dng: true, sub: 'Apaga também ' + ((X.vers[s.id] || []).length === 1 ? 'a versão' : 'as ' + (X.vers[s.id] || []).length + ' versões') })}

SHEETS.verMenu = t => {
  const v = X.ver[t.code]; const s = songOf(v);

    html: `<div class="sh-t"><div class="fx1"><h3 class="mono">${v.code}<small>${esc(v.channel || '')}${v.key ? ' · tom ' + esc(v.key) : ''}</small></h3></div>${ib('close', 'closeSheet', 'Fechar')}</div>
    <div style="padding:6px 0 10px;overflow-y:auto">
      ${menuRow('edit', 'Editar versão', 'editVer', { code: v.code })}
      ${menuRow('check', 'Marcar link como funcionando', 'setLink', { code: v.code, v: 'ok' })}
      ${menuRow('warn', 'Marcar link como quebrado', 'setLink', { code: v.code, v: 'broken' })}
      ${menuRow('copy', 'Copiar link', 'copyLink', { code: v.code })}
      <div style="height:1px;background:var(--line);margin:4px 20px"></div>

};

SHEETS.confirm = t => {
  let title, sub, det = [], label;
  if (t.kind === 'song') {
    const s = X.song[t.id]; const vs = X.vers[t.id] || []; const n = vs.reduce((a, v) => a + (v.sung || 0), 0);
    title = 'Apagar ' + esc(s.title) + '?'; sub = `Código ${s.id} · ${esc(singersStr(s))} · ${vs.length} ${vs.length === 1 ? 'versão' : 'versões'}`;
    det.push(`${vs.length === 1 ? 'A versão' : 'As ' + vs.length + ' versões'} (${vs.map(v => v.code).join(', ')})${n ? ' e o histórico de ' + n + (n === 1 ? ' vez cantada' : ' vezes cantada') : ''} somem.`);
    const ls = D.lists.filter(l => l.items.some(c => c.startsWith(s.id + '-'))); if (ls.length) det.push('Sai das listas: ' + ls.map(l => '“' + esc(l.name) + '”').join(', ') + '.');
    const cv = D.songs.filter(x => x.coverOf === s.id); if (cv.length) det.push(`O cover ${cv.map(c => c.id).join(', ')} continua, mas perde o vínculo “Cover de ${s.id}”.`);
    label = 'Apagar música e versões';
  } else if (t.kind === 'ver') {
    const v = X.ver[t.code]; const vs = X.vers[v.song] || [];
    title = 'Apagar a versão ' + v.code + '?'; sub = [v.channel, v.key && 'tom ' + v.key, v.voice].filter(Boolean).map(esc).join(' · ');
    if (v.sung) det.push(`Cantada ${v.sung} ${v.sung === 1 ? 'vez' : 'vezes'}${v.lastSung ? ' (última em ' + fmtDay(v.lastSung) + ')' : ''}: o histórico dessa versão também some.`);
    det.push(vs.length > 1 ? `A música ${v.song} continua, com as outras versões.` : 'Era a única versão: a música também será apagada.');
    if (D.lists.some(l => l.items.includes(v.code))) det.push('Sai das listas em que estiver.');
    label = 'Apagar versão';
  } else {
    const l = D.lists.find(x => x.id === t.id);
    title = 'Apagar a lista “' + esc(l.name) + '”?'; sub = 'As músicas continuam no catálogo. Só a lista é apagada.'; label = 'Apagar lista';
  }
  return {
    label: 'Confirmar exclusão',
    html: `<div class="fx g12" style="padding:10px 20px 0;align-items:flex-start"><div style="width:44px;height:44px;flex:none;border-radius:22px;background:var(--surface2);color:var(--danger);display:flex;align-items:center;justify-content:center">${ic('trash', 22)}</div><div class="fx1"><div style="font-size:19px;font-weight:800;line-height:1.25" class="jp">${title}</div><div class="muted" style="font-size:13px;margin-top:4px;line-height:1.4">${sub}</div></div></div>
    <div class="sh-b" style="padding:12px 20px 0">${det.map(d => `<div class="fx g10" style="padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.4"><span class="muted" style="display:flex;margin-top:1px">${ic('warn', 16)}</span><span class="fx1">${d}</span></div>`).join('')}
    <div class="hint" style="margin-top:6px">${t.kind === 'song' ? 'Antes de apagar muita coisa, vale compartilhar um backup. ' : ''}Fica um aviso com “Desfazer” por 10 segundos.</div></div>
    ${shFoot(btn('Cancelar', 'closeSheet', { cls: 'lg' }) + btn(label, 'doDel', { cls: 'danger grow lg' }))}`
  };
};

SHEETS.useList = t => {
  const l = D.lists.find(x => x.id === t.id); const n = l.items.filter(c => X.ver[c]).length; const w = D.queue.length ? D.queue.length - 1 : 0;
  return {

function onlineTag(f, t, seen) {
  const d = ui.draft || {}; const nv = norm(f.value);
  if (seen.has(f.key + ':' + nv)) return { tag: 'igual ao outro', on: false };
  seen.add(f.key + ':' + nv);

    const have = [d.singer].concat(d.aliases || []).map(norm);
    return have.includes(nv) ? { tag: 'já existe', on: false } : { tag: d.singer ? 'nova grafia' : 'campo vazio', on: true };
  }
  const cur = String(d[f.key] || '').trim();

}

function purgeVersion(code) {
  D.versions = D.versions.filter(v => v.code !== code);

  D.lists.forEach(l => { if (l.items.includes(code)) { l.items = l.items.filter(c => c !== code); l.updated = now(); } });
  D.history = D.history.filter(h => h.code !== code);
